<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>neodit</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #F2F2F2; padding-bottom: 60px; }
        header { background: #0078D7; color: #fff; padding: 10px; font-size: 18px; display: flex; justify-content: space-between; }
        .section { background: #fff; margin: 10px; padding: 15px; border: 1px solid #ccc; display: none; }
        .section.active { display: block; }
        input, textarea { width: 100%; margin: 5px 0 10px; padding: 8px; box-sizing: border-box; display: block; }
        input[type="button"] { background: #0078D7; color: #fff; border: none; font-weight: bold; cursor: pointer; }
        .post { background: #fff; border: 1px solid #ccc; padding: 15px; margin: 10px; position: relative; }
        .votes { position: absolute; right: 15px; top: 15px; text-align: center; background: #f3f3f3; padding: 5px; border: 1px solid #ccc; }
        .vote-btn { cursor: pointer; padding: 0 5px; font-weight: bold; }
        .vote-btn.voted { color: #0078D7; }
        .comment-box { margin-left: 10px; border-left: 2px solid #0078D7; padding-left: 8px; background: #fafafa; margin-top: 5px; }
        .reply-form { margin-top: 10px; display: flex; gap: 5px; }
        .reply-form input[type="text"] { margin: 0; }
        .reply-form input[type="button"] { width: auto; margin: 0; }
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #1F1F1F; display: flex; }
        .nav-item { background: none; border: none; color: #A6A6A6; width: 33.3%; padding: 15px 5px; text-align: center; cursor: pointer; }
        .nav-item.active { color: #0078D7; font-weight: bold; }
        .empty-msg { color: #888; text-align: center; margin-top: 30px; font-style: italic; }
        .del-btn { background: #d9534f; color: white; border: none; padding: 3px 8px; font-size: 11px; cursor: pointer; margin-top: 5px; }
    </style>
    <script>
        var user = "Гость";

        window.onload = function() {
            var savedUser = localStorage.getItem('neodit_user');
            if (savedUser) { user = savedUser; }
            updateHeader();
            renderFeed();
        };

        function updateHeader() {
            var statusElem = document.getElementById('status');
            statusElem.innerText = (user === "giga50📱") ? "Создатель: u/" + user : "u/" + user;
        }

        function tab(id, btn) {
            var s = document.getElementsByClassName('section');
            for(var i=0; i<s.length; i++) s[i].classList.remove('active');
            document.getElementById(id).classList.add('active');
            var n = document.getElementsByClassName('nav-item');
            for(var i=0; i<n.length; i++) n[i].classList.remove('active');
            btn.classList.add('active');
        }

        function login(reg) {
            var n = document.getElementById('u').value.trim();
            var p = document.getElementById('p').value.trim();
            if(!n || !p) return alert("Введите ник и пароль!");
            
            user = n;
            localStorage.setItem('neodit_user', user);
            updateHeader();
            
            alert(reg ? "Аккаунт создан!" : "Вы вошли!");
            tab('t-feed', document.getElementById('b-feed'));
            renderFeed();
        }

        function vote(id, btn) {
            var e = document.getElementById(id), v = parseInt(e.innerText);
            if(btn.classList.toggle('voted')) e.innerText = v + 1;
            else e.innerText = v - 1;
        }

        function getPosts() {
            var posts = localStorage.getItem('neodit_posts');
            return posts ? JSON.parse(posts) : [];
        }

        function renderFeed() {
            var feedElem = document.getElementById('feed');
            var posts = getPosts();
            
            if (posts.length === 0) {
                feedElem.innerHTML = '<div id="empty-msg" class="empty-msg">Лента пуста. Создайте первый пост на вкладке сверху!</div>';
                return;
            }

            var html = "";
            for (var i = posts.length - 1; i >= 0; i--) {
                var p = posts[i];
                var isAuthorOrMe = (p.author === user || user === "giga50📱");
                var deleteButton = isAuthorOrMe ? '<button class="del-btn" onclick="deletePost(' + p.id + ')">Удалить</button>' : '';
                var roleText = (p.author === "giga50📱") ? "Создатель: u/" : "u/";

                html += [
                    '<div class="post">',
                        '<div class="votes"><span class="vote-btn" onclick="vote(\'s-', p.id, '\', this)">▲</span><span id="s-', p.id, '">1</span></div>',
                        '<b>', p.title, '</b><div style="font-size:12px; color:#555; margin-bottom: 5px;">', roleText, p.author, '</div>',
                        '<div>', p.content, '</div>',
                        '<div id="c-', p.id, '"></div>',
                        deleteButton,
                        '<div class="reply-form"><input type="text" id="i-', p.id, '" placeholder="Ответ..."><input type="button" value="->" onclick="comm(\'', p.id, '\')"></div>',
                    '</div>'
                ].join('');
            }
            feedElem.innerHTML = html;
        }

        function post() {
            var t = document.getElementById('p_t').value.trim(), c = document.getElementById('p_c').value.trim();
            if(!t || !c) return alert("Заполните поля!");
            
            var posts = getPosts();
            var newPost = { id: Date.now(), title: t, content: c, author: user };
            posts.push(newPost);
            localStorage.setItem('neodit_posts', JSON.stringify(posts));

            document.getElementById('p_t').value = "";
            document.getElementById('p_c').value = "";
            
            tab('t-feed', document.getElementById('b-feed'));
            renderFeed();
        }

        function deletePost(id) {
            if(!confirm("Удалить?")) return;
            var posts = getPosts();
            posts = posts.filter(function(p) { return p.id !== id; });
            localStorage.setItem('neodit_posts', JSON.stringify(posts));
            renderFeed();
        }

        function comm(id) {
            var i = document.getElementById('i-' + id), t = i.value.trim();
            if(!t) return;
            var roleText = (user === "giga50📱") ? "Создатель: u/" : "u/";
            document.getElementById('c-' + id).innerHTML += '<div class="comment-box"><b>' + roleText + user + ':</b> ' + t + '</div>';
            i.value = "";
        }
    </script>
</head>
<body>

    <header>neodit <span id="status">u/Гость</span></header>

    <div id="t-feed" class="section active">
        <h3>Лента новостей</h3>
        <input type="button" value="Обновить ленту" onclick="renderFeed()" style="background:#5cb85c; margin-bottom:10px; color:white;">
        <div id="feed"></div>
    </div>

    <div id="t-create" class="section">
        <h3>Создать пост</h3>
        <input type="text" id="p_t" placeholder="Заголовок">
        <textarea id="p_c" placeholder="Текст публикации" rows="4"></textarea>
        <input type="button" value="Опубликовать" onclick="post()">
    </div>

    <div id="t-prof" class="section">
        <h3>Вход и Регистрация</h3>
        <label for="u">Имя пользователя:</label>
        <input type="text" id="u" placeholder="Никнейм">
        
        <label for="p">Пароль:</label>
        <input type="password" id="p" placeholder="Пароль">
        
        <input type="button" value="Войти" onclick="login(false)">
        <input type="button" value="Регистрация" onclick="login(true)" style="background:#555; margin-top:5px;">
    </div>

    <div class="nav-bar">
        <button id="b-feed" class="nav-item active" onclick="tab('t-feed', this)">ЛЕНТА</button>
        <button class="nav-item" onclick="tab('t-create', this)">СОЗДАТЬ</button>
        <button class="nav-item" onclick="tab('t-prof', this)">ПРОФИЛЬ</button>
    </div>

</body>
</html>
